task: multitask
seed: 42
tasks:
  - name: classification
    weight: 1.0
    num_labels: 3
  - name: ner
    weight: 1.5
    num_labels: 9
  - name: qa
    weight: 1.0

model:
  shared_encoder: "roberta-base"
  max_seq_length: 128
  qa_max_seq_length: 384

training:
  batch_size: 8
  learning_rate: 3.0e-5
  head_learning_rate: 1.0e-3
  scheduler: "linear"
  warmup_ratio: 0.1
  epochs: 20
  early_stopping_patience: 4
  weight_decay: 0.01
  max_grad_norm: 1.0
  sampling_strategy: "round_robin"
